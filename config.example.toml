# config.toml — ihealth-relay ローカル設定 (Phase 1 B1 / Issue #18)
#
# 使い方:
#   1. このファイルを `cp config.example.toml config.toml` でコピー
#   2. 必要に応じて Notion DB のプロパティ名 / Obsidian 日記の frontmatter キー名を編集
#   3. `config.toml` は .gitignore 対象 (個人設定なので git 管理外)
#
# 不在時の挙動: 各 publisher の既定名がそのまま使われる.
#   - Notion: 内部 PROPERTY_MAP (英語名 "Date" / "Step Count" / ...).
#     詳細は src/ihealth/publishers/notion.py の PROPERTY_MAP を参照
#   - Obsidian 日記: 日本語のキー名 ("歩数 (歩)" / "気温" / "Github" / ...).
#     詳細は src/ihealth/publishers/obsidian.py の DEFAULT_PROPERTY_MAP を参照
#
# 本ファイルの [publishers.notion] 節は「日本語の列名を持つ既存 Notion DB」向けの
# override 例. 英語既定の列名で Notion DB を新しく用意するなら [publishers.notion]
# 以下を削除する (Notion を使わないなら残しても影響しない).
# [publishers.obsidian] 節は既定値と同じ値だけが有効になっているので、そのまま
# コピーしても日記のキー名は変わらない.
#
# 設定ファイルが壊れている (構文エラー / 未知のフィールド名 / 空のキー名 / 2 つの
# フィールドが同じキー名に向く) 場合は、どの publisher でも起動時に設定エラー
# (終了コード 3 + Reminders 通知) で止まる.

# ----------------------------------------------------------------
# 日付プロパティ (Phase 1 B2 で導入)
# ----------------------------------------------------------------
# `find_page_by_date` が Notion DB の filter キーに使う列名.
# 既定値は "Date". 別名の Notion DB なら "日付" に override する.

[publishers.notion]
date_property = "日付"

# ----------------------------------------------------------------
# Notion DB のプロパティ名マッピング (DailyHealthData フィールド → Notion 列名)
# ----------------------------------------------------------------
# 全 15 フィールドを 別名の Notion DB 互換の日本語名で記載.
# 一部だけ override したい場合は、不要なセクションを削除すれば
# そのフィールドだけ既定値 (英語) が使われる.

[publishers.notion.fields.step_count]
property = "歩数 (歩)"

[publishers.notion.fields.distance_km]
property = "移動距離 (km)"

[publishers.notion.fields.active_energy_kcal]
property = "消費カロリー (kcal)"

[publishers.notion.fields.exercise_minutes]
property = "アクティビティ時間 (分)"

[publishers.notion.fields.exercise_intensity_score]
property = "運動強度スコア"

[publishers.notion.fields.heart_rate_avg]
property = "平均心拍数 (bpm)"

[publishers.notion.fields.heart_rate_max]
property = "最大心拍数 (bpm)"

[publishers.notion.fields.heart_rate_resting]
property = "安静時心拍数 (bpm)"

[publishers.notion.fields.oxygen_saturation]
property = "酸素飽和度 (%)"

[publishers.notion.fields.sleep_hours]
property = "睡眠時間 (分)"

[publishers.notion.fields.nap_hours]
property = "昼寝時間"

[publishers.notion.fields.mindful_sessions]
property = "瞑想回数 (回)"

[publishers.notion.fields.mindful_minutes]
property = "瞑想時間 (分)"

[publishers.notion.fields.body_mass_kg]
property = "体重 (kg)"

[publishers.notion.fields.body_fat_percentage]
property = "体脂肪率 (%)"

# ----------------------------------------------------------------
# Obsidian 日記 (--publisher obsidian) の frontmatter キー名
# ----------------------------------------------------------------
# 日記テンプレートのキー名が既定と違うときだけ、該当フィールドの例のコメントを
# 外して書き換える (既定と同じ名前は書かなくてよい). 内部名 → 既定キー:
#
#   健康 (Health Auto Export)
#     step_count               歩数 (歩)
#     sleep_hours              睡眠時間 (分)
#     nap_hours                昼寝時間
#     active_energy_kcal       消費カロリー (kcal)
#     distance_km              移動距離 (km)
#     heart_rate_resting       安静時心拍数 (bpm)
#     heart_rate_avg           平均心拍数 (bpm)
#     heart_rate_max           最大心拍数 (bpm)
#     oxygen_saturation        酸素飽和度 (%)
#     exercise_intensity_score 運動強度スコア
#     mindful_minutes          瞑想時間 (分)
#     mindful_sessions         瞑想回数 (回)
#     exercise_minutes         アクティビティ時間 (分)
#     body_mass_kg             体重 (kg)
#     body_fat_percentage      体脂肪率 (%)
#     activity_detail          アクティビティ詳細
#   天気 (気象庁)
#     temperature 気温 / humidity 湿度 / pressure 気圧 / weather 天気 /
#     sunshine 日照時間 / precipitation 降水量
#   GitHub 活動
#     github                   Github
#
# 2 つの内部名を同じキーに向けたり、date_property と同じキーにしたりすると
# 起動時に設定エラー (終了コード 3) になる (片方の値が黙って消えるのを防ぐため).
#
# 日記ノート / テンプレート側の注意: 書き込み対象のキーの entry にコメント (行末の
# "# …" や、entry の行の間に挟んだコメント行) がある、または同じキーが 2 回以上ある
# ノートでは、そのキーだけ書き換えない (他のキーは書く. 実行レポートに kept と
# warning "comment present" / "duplicate key" が残る). テンプレートに注記を書くなら、
# キーの上の独立した行 (行頭の "#") にする.

[publishers.obsidian]
# 日付キーの名前. 本ツールがこのキーに値を書くことはなく、
# OBSIDIAN_CREATE_MISSING=minimal で「日付だけの最小ノート」を作るときにだけ使う.
# 既定 "日付". 上の書き込み対象のキー名と同じ名前にはできない.
date_property = "日付"

# 例: GitHub 活動を "GitHub" というキーに書く
# [publishers.obsidian.fields.github]
# property = "GitHub"

# 例: 歩数を英語のキーに書く
# [publishers.obsidian.fields.step_count]
# property = "Steps"
